# Handsi Default Configuration
#
# This file contains the default settings for Handsi.
# DO NOT EDIT THIS FILE DIRECTLY - it will be overwritten on updates.
#
# To customize your settings:
# 1. Use the Settings panel in the app (changes auto-save)
# 2. Or manually edit: ~/.handsi/config.yaml
#
# Your custom settings in ~/.handsi/config.yaml will override these defaults.

camera:
  device_id: 0
  resolution: [640, 480]
  # Adaptive FPS ranges
  fps_idle: 2         # Hz when no hands detected
  fps_attentive: 10   # Hz when hands present, no gesture
  fps_active: 60      # Hz during/after gesture execution

tracking:
  max_hands: 2
  model_complexity: 1      # 0=lite (faster), 1=full (more accurate). Use 0 for faster startup (~5s vs ~15s)
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  # Activity level transitions
  idle_timeout: 3.0        # seconds without hands → IDLE
  attentive_timeout: 2.0   # seconds without gesture → ATTENTIVE
  fps_idle: 2         # Hz when no hands detected
  fps_attentive: 10   # Hz when hands present, no gesture
  fps_active: 60      # Hz during/after gesture execution

  # MediaPipe Holistic settings (hands + face + pose tracking)
  # Used for hand tracking and habit awareness features
  holistic_model_complexity: 1      # 0=lite, 1=medium (default), 2=heavy
  holistic_min_detection_confidence: 0.5
  holistic_min_tracking_confidence: 0.5

gestures:
  # Debouncing: cooldown after gesture fires
  debounce_ms: 500          # ignore same gesture for 300ms after firing
  # Latch: cooldown for activation gesture
  latch_cooldown_ms: 500    # prevent rapid latch on/off
  latch_active: true         # start with gesture control enabled
  # Temporal smoothing
  smoothing_window: 3       # frames to average over
  consistency_threshold: 0.6  # fraction of frames that must agree (0-1)

  # Detection thresholds - ALL VALUES ARE NOW HAND-RELATIVE (as fraction of hand size)
  # Hand size = distance from wrist to middle finger MCP knuckle
  # This makes gestures work consistently regardless of distance from camera

  pinch_threshold: 0.25          # max distance for pinch (15% of hand size)
  fist_threshold: 1.0            # max fingertip distance from wrist (65% of hand size)
  open_hand_distance_threshold: 0.3   # min distance between thumb and fingers
  open_hand_spread_threshold: 0.1     # min spread between adjacent fingers (25% of hand size)
  swipe_velocity_threshold: 5.0        # min horizontal velocity (80% of hand size per second)
  thumbs_vertical_threshold: 1.3       # min vertical distance for thumbs up/down (130% of hand size)
  confidence_threshold: 0.7            # min confidence to confirm gesture

actions:
  # Gesture → Action mappings (fully modular - change mappings here, no code changes needed)
  mappings:
    open_hand: mouse_move           # Continuous: hand position controls cursor
    index_pinch: click               # Single: left click
    two_finger_pinch: double_click
    middle_pinch: right_click
    # swipe: switch_desktop          # Disabled by default. Swipe in any direction (direction passed via metadata)
    thumbs_up: enable_latch          # Enable gesture control (latch ON)
    thumbs_down: disable_latch       # Disable gesture control (latch OFF)
    two_fingers_point: continuous_scroll
    two_hands_pinch: continuous_zoom
    ring_pinch: continuous_volume
    # index_point: continuous_tab        # Point with index finger to switch tabs
    # Habit awareness mappings (only triggered when habit_awareness.enabled = true)
    facial_contact: alert_facial_contact

  # Habit awareness alert settings
  habit_alerts:
    visual_enabled: true              # Show red banner in Tauri GUI (real-time)
    audio_enabled: true               # Play system beep sound
    alert_cooldown_seconds: 30.0      # Min time between audio alerts (prevents spam)

  # Mouse movement settings
  mouse:
    mirror_x: true                  # Mirror X-coordinate (flip horizontally) for natural camera movement
    smoothing_factor: 0.3           # EMA smoothing (0=no smoothing, 1=max smoothing) (alpha = 1 - smoothing factor)
    dead_zone: 0.015                # Ignore movements smaller than this (hand jitter)
    dead_zone_curve: 3.0            # Power curve for smooth dead zone (1.0=linear, 2.0=quadratic, 3.0=cubic)
    dead_zone_min_damping: 0.01      # Minimum damping factor at zero movement (0.1 = 10% of input)
    sensitivity: 0.5                # Movement multiplier (higher = faster)
    interpolation_rate: 60.0        # Hz - cursor interpolation update rate (higher = smoother but more CPU)

  # Continuous scroll settings (fist gesture)
  scroll:
    sensitivity: 5.0                # Scroll speed multiplier (higher = faster scroll)
    dead_zone: 0.02                 # Ignore hand movements smaller than 1% of screen height
    dead_zone_curve: 3.0            # Power curve for smooth dead zone (1.0=linear, 2.0=quadratic, 3.0=cubic)
    dead_zone_min_damping: 0.01      # Minimum damping factor at zero movement (0.1 = 10% of input)
    max_scroll_per_frame: 1000       # Clamp maximum scroll amount per frame (pixels)
    invert: true                    # Invert scroll (only for vertical scroll)
    momentum_enabled: true          # Enable kinetic scrolling (momentum continues after gesture ends)
    momentum_decay: 0.95             # Velocity decay per frame (0.95 = 5% reduction, higher = longer momentum)
    momentum_min_velocity: 150.0    # Min velocity to trigger momentum (pixels/frame)
    momentum_stop_threshold: 100.0  # Stop momentum when velocity drops below this

  zoom:
    sensitivity: 0.1
    dead_zone: 0.05
    dead_zone_curve: 2.0
    dead_zone_min_damping: 0.1

  volume:
    mirror_x: true
    sensitivity: 1.0
    dead_zone: 0.05
    dead_zone_curve: 2.0
    dead_zone_min_damping: 0.1

  tab:
    sensitivity: 0.1
    dead_zone: 0.05
    dead_zone_curve: 3.0
    dead_zone_min_damping: 0.1

system:
  log_level: INFO           # DEBUG | INFO | WARN | ERROR
  # log_file: ~/.handsi/logs/handsi.log  # default; override with absolute path
  preview: false            # override with --preview
  preview_show_features: false  # toggle with 'f' key in preview window
  debug: false              # override with --debug

macos:
  # macOS-specific settings
  accessibility_check: true  # verify permissions on startup

# Habit Awareness - detect and alert on negative habits
# Requires MediaPipe Holistic tracking (face)
habit_awareness:
  enabled: false                            # Default to false - enable in Settings panel

  # Facial contact detection (hand near face)
  facial_contact_enabled: true
  facial_contact_distance_threshold: 0.2    # Max distance from face (fraction of face size)
  facial_contact_duration_threshold: 0.7    # Must be detected in 70% of frames
