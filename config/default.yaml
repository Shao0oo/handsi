camera:
  device_id: 0
  resolution: [640, 480]
  # Adaptive FPS ranges
  fps_idle: 10         # Hz when no hands detected
  fps_attentive: 24   # Hz when hands present, no gesture
  fps_active: 60      # Hz during/after gesture execution

tracking:
  max_hands: 2
  min_detection_confidence: 0.5
  min_tracking_confidence: 0.5
  # Activity level transitions
  idle_timeout: 3.0        # seconds without hands → IDLE
  attentive_timeout: 2.0   # seconds without gesture → ATTENTIVE
  fps_idle: 10         # Hz when no hands detected
  fps_attentive: 24   # Hz when hands present, no gesture
  fps_active: 60      # Hz during/after gesture execution

gestures:
  # Debouncing: cooldown after gesture fires
  debounce_ms: 300          # ignore same gesture for 300ms after firing
  # Latch: cooldown for activation gesture
  latch_cooldown_ms: 500    # prevent rapid latch on/off
  # Temporal smoothing
  smoothing_window: 1       # frames to average over
  consistency_threshold: 0.6  # fraction of frames that must agree (0-1)

  # Detection thresholds - ALL VALUES ARE NOW HAND-RELATIVE (as fraction of hand size)
  # Hand size = distance from wrist to middle finger MCP knuckle
  # This makes gestures work consistently regardless of distance from camera

  pinch_threshold: 0.25           # max distance for pinch (15% of hand size)
  fist_threshold: 0.65            # max fingertip distance from wrist (65% of hand size)
  open_hand_distance_threshold: 0.3   # min distance between thumb and fingers
  open_hand_spread_threshold: 0.1     # min spread between adjacent fingers (25% of hand size)
  swipe_velocity_threshold: 4.0        # min horizontal velocity (80% of hand size per second)
  confidence_threshold: 0.7            # min confidence to confirm gesture

actions:
  # Gesture → Action mappings (fully modular - change mappings here, no code changes needed)
  mappings:
    # Phase 1: Implemented gestures with actions
    open_hand: mouse_move           # Continuous: hand position controls cursor
    index_pinch: click               # Single: left click
    middle_pinch: double_click

    # Ready to map (actions implemented, just add gesture mapping here):
    # fist: scroll_down
    # middle_pinch: scroll_up
    # ring_pinch: zoom_in
    # pinky_pinch: zoom_out
    # swipe_left: switch_desktop_left
    # swipe_right: switch_desktop_right
    # thumbs_up: toggle_latch

  # Mouse movement settings
  mouse:
    mirror_x: true                  # Mirror X-coordinate (flip horizontally) for natural camera movement
    smoothing_factor: 0.1           # EMA smoothing (0=no smoothing, 1=max smoothing) (alpha = 1 - smoothing factor)
    dead_zone: 0.0                 # Ignore movements smaller than this (hand jitter)
    sensitivity: 1.2                # Movement multiplier (higher = faster)
    interpolation_rate: 60.0        # Hz - cursor interpolation update rate (higher = smoother but more CPU)

system:
  log_level: INFO           # DEBUG | INFO | WARN | ERROR
  log_file: logs/handsi.log
  preview: false            # override with --preview
  preview_show_features: false  # toggle with 'f' key in preview window
  debug: false              # override with --debug

macos:
  # macOS-specific settings
  accessibility_check: true  # verify permissions on startup
  scroll_speed: 10           # pixels per scroll event
  zoom_step: 0.1             # zoom increment (0.1 = 10%)
