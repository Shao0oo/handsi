name: Release Handsi

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'

jobs:
  release-macos:
    name: Build and Release (macOS ${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest  # M1 runner
            arch: arm64
          - target: x86_64-apple-darwin
            runner: macos-15-intel  # Intel runner
            arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Install Python dependencies
        run: |
          # Install project dependencies first (includes all required packages)
          pip install -e .

          # Install PyInstaller
          pip install pyinstaller

          # Install macOS-specific dependencies
          pip install pyobjc-framework-Quartz pyobjc-framework-Cocoa

      - name: Build Python backend with PyInstaller
        run: |
          echo "Building Python backend for ${{ matrix.target }}..."
          echo "System architecture: $(uname -m)"
          python -c "import platform; print(f'Python platform: {platform.machine()}')"

          # Build Python backend (PyInstaller will create native binary for this architecture)
          pyinstaller src-tauri/bundle/handsi-backend.spec \
            --distpath src-tauri/bin \
            --workpath build/pyinstaller \
            --clean

          # Verify the binary was created with the correct name
          EXPECTED_BINARY="src-tauri/bin/handsi-backend-${{ matrix.target }}"

          if [ -f "$EXPECTED_BINARY" ]; then
            echo "✓ Binary found: $EXPECTED_BINARY"
          elif [ -f "src-tauri/bin/handsi-backend" ]; then
            echo "Binary created without suffix, renaming..."
            mv src-tauri/bin/handsi-backend "$EXPECTED_BINARY"
          else
            echo "❌ Error: Binary not found!"
            ls -la src-tauri/bin/
            exit 1
          fi

          chmod +x "$EXPECTED_BINARY"

          echo "Contents of src-tauri/bin/:"
          ls -lh src-tauri/bin/

          echo "✓ Python backend ready: $EXPECTED_BINARY"

      - name: Build Tauri app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Handsi ${{ github.ref_name }}'
          releaseBody: |

            ## Handsi ${{ github.ref_name }}

            Download

            Choose the right DMG:
            - Apple Silicon (MX chip): Handsi_x.x.x_aarch64.dmg
            - Intel: Handsi_x.x.x_x86_64.dmg
            Not sure?  → About This Mac → check Chip (Apple) vs Processor (Intel).

            ### Installation (macOS)
            1. Download the DMG file below
            2. Open the DMG and drag Handsi.app to Applications

            ### First Launch
            macOS will show a security warning:
            ```
            “Handsi.app” is damaged and can’t be opened. You should move it to the Trash.
            ```
            This is because I do not have an apple developer account-thus, the app is non code-signed.

            #### **Workaround in Terminal:** 
            ```bash
            xattr -cr /Applications/Handsi.app
            open /Applications/Handsi.app  # or just click app icon
            ```

            #### Get Handsi!
            - Wait for the app to load (30-60 seconds)
            - Load cameras, select camera, and start detection
            - Grant Camera and Accessibility permissions when / if prompted

          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.target }}
