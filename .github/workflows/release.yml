name: Release Handsi

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v0.1.0, v1.2.3
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'

jobs:
  release-macos:
    name: Build and Release (macOS)
    runs-on: macos-latest  # GitHub now uses M1 runners (aarch64)

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm install

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          # Install project dependencies first (includes all required packages)
          pip install -e .

          # Install PyInstaller
          pip install pyinstaller

          # Install macOS-specific dependencies
          pip install pyobjc-framework-Quartz pyobjc-framework-Cocoa

      - name: Build Python backend with PyInstaller
        run: |
          # Detect what architecture we're running on
          echo "System info:"
          uname -m
          python -c "import platform; print(f'platform.machine() = {platform.machine()}')"

          # Build Python backend (spec file auto-detects architecture)
          pyinstaller src-tauri/bundle/handsi-backend.spec \
            --distpath src-tauri/bin \
            --workpath build/pyinstaller \
            --clean

          # Show what was created
          echo "Contents of src-tauri/bin/:"
          ls -lh src-tauri/bin/

          # Determine expected name based on architecture
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            TARGET_TRIPLE="aarch64-apple-darwin"
          else
            TARGET_TRIPLE="x86_64-apple-darwin"
          fi

          BINARY_PATH="src-tauri/bin/handsi-backend-${TARGET_TRIPLE}"

          # Check if binary exists with correct name
          if [ -f "$BINARY_PATH" ]; then
            echo "✓ Binary found with correct name: $BINARY_PATH"
          else
            echo "❌ Binary not found at expected path: $BINARY_PATH"
            echo "Checking for binary without suffix..."

            if [ -f "src-tauri/bin/handsi-backend" ]; then
              echo "Found handsi-backend without suffix, renaming..."
              mv src-tauri/bin/handsi-backend "$BINARY_PATH"
              echo "✓ Renamed to: $BINARY_PATH"
            else
              echo "Error: No binary found at all!"
              exit 1
            fi
          fi

          # Make executable
          chmod +x "$BINARY_PATH"

          echo "✓ Python backend ready: $BINARY_PATH"

      - name: Build Tauri app and create release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Handsi ${{ github.ref_name }}'
          releaseBody: |
            ## Handsi ${{ github.ref_name }}

            Contactless desktop control using hand tracking.

            ### Installation (macOS)
            1. Download the DMG file below
            2. Open the DMG and drag Handsi.app to Applications
            3. Launch Handsi from Applications
            4. Grant Camera and Accessibility permissions when prompted

            ### First Launch
            macOS will show a security warning because the app is not code-signed.
            **Workaround:** Right-click Handsi.app → Open (instead of double-click)

            Or run in Terminal:
            ```bash
            xattr -cr /Applications/Handsi.app
            open /Applications/Handsi.app
            ```

            ### System Requirements
            - macOS 10.15+ (Catalina or newer)
            - Webcam (built-in or external)
            - Apple Silicon (M1/M2/M3) or Intel processor

            🤖 Built with [Tauri](https://tauri.app) + Python + MediaPipe
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin
