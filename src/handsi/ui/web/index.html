<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Handsi Control Panel</title>
    <link rel="stylesheet" href="styles.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <h1>Handsi Control Panel</h1>
            <div class="status-indicator" id="connectionStatus">
                <span class="dot"></span>
                <span class="label">Connected</span>
            </div>
        </header>

        <!-- Status Card -->
        <section class="card">
            <h2 class="card-title">Status</h2>
            <div class="status-grid">
                <div class="status-item">
                    <span class="status-label">Detection:</span>
                    <span class="status-value" id="runningStatus">Stopped</span>
                </div>
                <div class="status-item">
                    <span class="status-label">FPS:</span>
                    <span class="status-value" id="fpsValue">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Activity:</span>
                    <span class="status-value" id="activityValue">IDLE</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Gesture Control:</span>
                    <span class="status-value" id="latchStatus">Disabled</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Frames Captured:</span>
                    <span class="status-value" id="framesCaptured">0</span>
                </div>
                <div class="status-item">
                    <span class="status-label">Frames Processed:</span>
                    <span class="status-value" id="framesProcessed">0</span>
                </div>
            </div>
        </section>

        <!-- Controls Card -->
        <section class="card">
            <h2 class="card-title">Controls</h2>
            <div class="controls">
                <button id="startBtn" class="btn btn-primary">Start Detection</button>
                <button id="stopBtn" class="btn btn-secondary" disabled>Stop Detection</button>
            </div>
            <div id="controlMessage" class="message"></div>
        </section>

        <!-- Settings Card -->
        <section class="card">
            <h2 class="card-title">Settings</h2>

            <!-- Mouse Settings -->
            <div class="settings-section">
                <h3 class="settings-subtitle">Mouse Control</h3>
                <div class="setting-item">
                    <label for="sensitivity">
                        Sensitivity: <span id="sensitivityValue">0.7</span>
                    </label>
                    <input type="range" id="sensitivity" min="0.1" max="5.0" step="0.1" value="0.7">
                </div>
                <div class="setting-item">
                    <label for="smoothing">
                        Smoothing: <span id="smoothingValue">0.3</span>
                    </label>
                    <input type="range" id="smoothing" min="0.0" max="1.0" step="0.05" value="0.3">
                </div>
                <div class="setting-item">
                    <label for="deadZone">
                        Dead Zone: <span id="deadZoneValue">0.003</span>
                    </label>
                    <input type="range" id="deadZone" min="0.0" max="0.1" step="0.001" value="0.003">
                </div>
                <div class="setting-item checkbox-item">
                    <label for="mirrorX">
                        <input type="checkbox" id="mirrorX" checked>
                        Mirror X-axis (natural camera movement)
                    </label>
                </div>
            </div>

            <!-- Gesture Thresholds -->
            <div class="settings-section">
                <h3 class="settings-subtitle">Gesture Detection</h3>
                <div class="setting-item">
                    <label for="pinchThreshold">
                        Pinch Threshold: <span id="pinchThresholdValue">0.2</span>
                    </label>
                    <input type="range" id="pinchThreshold" min="0.05" max="0.5" step="0.05" value="0.2">
                </div>
                <div class="setting-item">
                    <label for="fistThreshold">
                        Fist Threshold: <span id="fistThresholdValue">0.65</span>
                    </label>
                    <input type="range" id="fistThreshold" min="0.3" max="1.0" step="0.05" value="0.65">
                </div>
                <div class="setting-item">
                    <label for="swipeVelocity">
                        Swipe Velocity: <span id="swipeVelocityValue">5.0</span>
                    </label>
                    <input type="range" id="swipeVelocity" min="0.3" max="10.0" step="0.1" value="5.0">
                </div>
                <div class="setting-item">
                    <label for="openHandSpread">
                        Open Hand Spread: <span id="openHandSpreadValue">0.1</span>
                    </label>
                    <input type="range" id="openHandSpread" min="0.1" max="0.8" step="0.05" value="0.1">
                </div>
                <div class="setting-item">
                    <label for="thumbsVertical">
                        Thumbs Vertical Distance: <span id="thumbsVerticalValue">1.3</span>
                    </label>
                    <input type="range" id="thumbsVertical" min="0.5" max="2.0" step="0.1" value="1.3">
                </div>
            </div>

            <!-- Timing Settings -->
            <div class="settings-section">
                <h3 class="settings-subtitle">Timing</h3>
                <div class="setting-item">
                    <label for="debounceMs">
                        Debounce (ms): <span id="debounceMsValue">500</span>
                    </label>
                    <input type="range" id="debounceMs" min="0" max="2000" step="50" value="500">
                </div>
                <div class="setting-item">
                    <label for="latchCooldownMs">
                        Latch Cooldown (ms): <span id="latchCooldownMsValue">500</span>
                    </label>
                    <input type="range" id="latchCooldownMs" min="0" max="2000" step="50" value="500">
                </div>
                <div class="setting-item">
                    <label for="smoothingWindow">
                        Smoothing Window: <span id="smoothingWindowValue">3</span>
                    </label>
                    <input type="range" id="smoothingWindow" min="1" max="10" step="1" value="3">
                </div>
            </div>

            <div class="controls">
                <button id="saveSettingsBtn" class="btn btn-primary">Save Settings</button>
                <button id="resetSettingsBtn" class="btn btn-secondary">Reset to Defaults</button>
            </div>
            <div id="settingsMessage" class="message"></div>
        </section>

        <!-- Footer -->
        <footer class="footer">
            <p>Handsi - Contactless Desktop Control</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
